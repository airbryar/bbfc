name: Pictures

# When a team picture or the league logo is added, changed or removed, resize it
# for the site, save the result, and republish.
on:
  push:
    branches: [main]
    paths: ["team-pictures/**", "league-logo/**"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: pictures
  cancel-in-progress: false

jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the image tool
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.33.5

      - name: Make the site-size team pictures
        run: node scripts/make-logos.mjs

      - name: Make the league logo and home-screen icon
        run: node scripts/make-brand.mjs

      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/logos site/brand site/icons data/logos.json data/brand.json team-pictures/README.md
          if git diff --cached --quiet; then
            echo "Pictures already up to date"
          else
            git commit -m "Update pictures"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Site update started"
