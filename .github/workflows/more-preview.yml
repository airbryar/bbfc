name: Preview data (temporary)

# Preview only: reads fresh league data, lineups and the Waiver Wire on the more-preview
# branch and saves them there. Removed before the preview goes live.
on:
  push:
    branches: [more-preview]
    paths: ["scripts/fetch-trades.mjs", ".github/workflows/more-preview.yml"]

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-espn.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - run: node scripts/fetch-lineups.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - run: node scripts/fetch-trades.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          FORCE_TRADES: "1"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/espn.json data/lineups.json data/trades.json
          git diff --cached --quiet || (git commit -m "Preview data" && git push origin HEAD:more-preview)
